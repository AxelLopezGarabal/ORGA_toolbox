<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORGA toolbox</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/style_loader.css">
</head>
<body>

    <!-- Header Principal -->
    <header class="main-header">
        <div class="header-left">
            <!-- Botón Navicon (Menú Hamburguesa) -->
            <button class="menu-button" id="menuToggle" aria-label="Abrir menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 class="header-title"></h1>
        </div>
        
        <div class="header-actions">
            <!-- Botón Ayuda -->
            <button class="icon-button" aria-label="Ayuda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </button>

            <!-- Botón Modo Nocturno (Alterna entre Luna y Sol) -->
            <button class="icon-button" id="themeToggle" aria-label="Cambiar modo de luz">
                <!-- Icono de Luna (se muestra en modo claro) -->
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <!-- Icono de Sol (se muestra en modo oscuro) -->
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Menú Colapsable Lateral (Sidebar/Drawer) -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Herramientas</h3>
            <button class="close-button" id="menuClose" aria-label="Cerrar menú">&times;</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="./subPages/cache_t.html">Inicio</a></li>
            <li><a href="#">Tabla de Ejecución</a></li>
            <li><a href="#">Exportar Datos</a></li>
            <li><a href="#">Importar Archivo</a></li>
            <li><a href="#">Configuración</a></li>
        </ul>
    </nav>

    <!-- Fondo oscuro traslúcido cuando el menú está abierto -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main id="content-container">
        <div class="loader">Cargando contenido...</div>
    </main>

    <script src="./scripts/sidemenu.js"></script>
    <script src="./scripts/mode.js"></script>
    <script src="./scripts/load.js"></script>
</body>
</html>
