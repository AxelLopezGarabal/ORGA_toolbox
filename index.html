<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORGA toolbox</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/style_loader.css">
</head>
<body>

    <!-- Header Principal -->
    <header class="main-header">
        <div class="header-left">
            <!-- Botón Navicon (Menú Hamburguesa) -->
            <button class="menu-button" id="menuToggle" aria-label="Abrir menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 class="header-title"></h1>
        </div>
        
        <div class="header-actions">
            <!-- Botón Modo Nocturno (Alterna entre Luna y Sol) -->
            <button class="icon-button" id="themeToggle" aria-label="Cambiar modo de luz">
                <!-- Icono de Luna (se muestra en modo claro) -->
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <!-- Icono de Sol (se muestra en modo oscuro) -->
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Menú Colapsable Lateral (Sidebar/Drawer) -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Herramientas</h3>
            <button class="close-button" id="menuClose" aria-label="Cerrar menú">&times;</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="./index.html">Calculadora de Cache</a></li>
            <li><a href="./subPages/cache_t.html">Tabla de aciertos y fallos</a></li>
            <li><a href="#">Tabla de Ejecución</a></li>
            <li><a href="#">Seguimiento de pila</a></li>
            <li><a href="#">Sistemas de numeracion</a></li>
        </ul>
    </nav>

    <!-- Fondo oscuro traslúcido cuando el menú está abierto -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main id="content-container">
         <section class="hero">
            <div class="hero-contenido">
                 <div class="container">
                    <h1>Calculadora de Caché</h1>
                    <h3>funciones de mapeo</h3>
                    <div class="opciones-mapeo">   
                        <label>
                            <div>
                                <input id="0" type="radio" name="mapeo" value="asociativo" checked onclick="swap(1,0)">
                                <span>
                                    Mapeo Asociativo
                                </span>
                            </div>
                        </label>
                        
                        <label>
                            <div>
                                <input id="1" type="radio" name="mapeo" value="directo" onclick="swap(0,1)">
                                <span>
                                    Mapeo Directo
                                </span>
                            </div>
                        </label>
                    </div>

   <div class="diagram-container-cajas">

        <div class="container-cajas">

            <!-- MEMORIA PRINCIPAL -->
            <div class="column-cajas" style="position: relative;left: 4px;">

                <div class="mem-principal-box">
                    <div class="contenedor-lineal">
                        <input
                            id="capMemP"
                            type="number"
                            class="text-box-s box-internal-mp"
                            placeholder="cap. mem"
                        >

                        <select id="capMemPeso">
                            <option value="b">Bits</option>
                            <option value="B">Bytes</option>
                            <option value="Kb">Kbytes</option>
                        </select>
                    </div>
                </div>

                <!-- CORCHETE SUPERIOR -->
                <div class="bracket bracket-right-top-mp">
                    <input
                        id="CellxBloq"
                        type="number"
                        class="text-box"
                        placeholder="cellxbloq"
                        style="position: relative;left: 20px;top: 15px;"
                    >
                </div>

                <!-- CORCHETE IZQUIERDO -->
                <div class="bracket bracket-left-mp">
                    <input
                        id="nCell"
                        type="number"
                        class="text-box"
                        placeholder="#celdas"
                        style="    position: absolute;bottom: 150px;right: 20px;"
                    >
                </div>

                <!-- CORCHETE INFERIOR -->
                <div class="bracket bracket-bottom-mp">

                    <div
                        class="contenedor-lineal"
                        style="top: 22px; left: 4px;"
                    >
                        <input
                            id="capCell"
                            type="number"
                            class="text-box bottom-box"
                            placeholder="cap. celda"
                        >

                        <select id="capCellPeso">
                            <option value="b">Bits</option>
                            <option value="B">Bytes</option>
                            <option value="Kb">Kbytes</option>
                        </select>
                    </div>

                </div>

            </div>


            <!-- MEMORIA CACHE -->
            <div class="column-cajas">
                <div class="mem-cache-box">
                    <div
                        class="contenedor-lineal"
                        style="gap: 10px; left: -3px;"
                    >

                        <input
                            id="capMemC"
                            type="number"
                            class="text-box-s box-internal-mc"
                            placeholder="cap. cache"
                            style="width: 60%;"
                        >

                        <select id="capCachePeso">
                            <option value="b">Bits</option>
                            <option value="B">Bytes</option>
                            <option value="Kb">Kbytes</option>
                        </select>

                    </div>

                </div>


                <!-- CORCHETE INFERIOR -->
                <div class="bracket bracket-bottom-mc">

                    <div
                        class="contenedor-lineal"
                        style="gap: 5px; top: 25px; left: 2px;"
                    >

                        <input
                            id="capLine"
                            type="number"
                            class="text-box"
                            placeholder="cap. linea"
                        >

                        <select id="capLinePeso">
                            <option value="b">Bits</option>
                            <option value="B">Bytes</option>
                            <option value="Kb">Kbytes</option>
                        </select>

                    </div>

                </div>


                <!-- CORCHETE DERECHO -->
                <div class="bracket bracket-right-mc">

                    <input
                        id="nLines"
                        type="number"
                        class="text-box box-right-mc"
                        placeholder="# lineas"
                        style="position: absolute;top: 30px;left: 20px;"
                    >

                </div>
            </div>

        </div>

    </div>

</div>

        <div class="zona-calcular">
            <button
                id="button"
                class="generate-btn"
                onclick="calculate()">
            Calcular
            </button>

        </div>

        <section
            class="tarjeta-resultado"
            id="miTarjeta">
        
            <div class="resultado-titulo">
                <div class="resultado-icono">
                    ✓
                </div>

                <div>
                    <span>RESULTADO</span>
                    <h2>Resultado del cálculo</h2>
                </div>

            </div>

            <ul id="resList"></ul>

        </section>
    </main>

    <script src="./scripts/sidemenu.js"></script>
    <script src="./scripts/mode.js"></script>
    <script src="./scripts/calc.js"></script>
</body>
</html>
