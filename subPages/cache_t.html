<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORGA toolbox</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/style_loader.css">
</head>
<body>

    <!-- Header Principal -->
    <header class="main-header">
        <div class="header-left">
            <!-- Botón Navicon (Menú Hamburguesa) -->
            <button class="menu-button" id="menuToggle" aria-label="Abrir menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 class="header-title"></h1>
        </div>
        
        <div class="header-actions">
            <!-- Botón Ayuda -->
            <button class="icon-button" aria-label="Ayuda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </button>

            <!-- Botón Modo Nocturno (Alterna entre Luna y Sol) -->
            <button class="icon-button" id="themeToggle" aria-label="Cambiar modo de luz">
                <!-- Icono de Luna (se muestra en modo claro) -->
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <!-- Icono de Sol (se muestra en modo oscuro) -->
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Herramientas</h3>
            <button class="close-button" id="menuClose" aria-label="Cerrar menú">&times;</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="./subPages/cache_t.html">Inicio</a></li>
            <li><a href="#">Tabla de Ejecución</a></li>
            <li><a href="#">Exportar Datos</a></li>
            <li><a href="#">Importar Archivo</a></li>
            <li><a href="#">Configuración</a></li>
        </ul>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <!-- fin del header -->
    <main id="content-container">
         <section class="hero">
            <div class="hero-contenido">
                 <div class="container">
                    <h1>Tabla de Caché</h1>
                    <h3>funciones de mapeo</h3>
                    <div class="opciones-mapeo">   
                        <label>
                            <div>
                                <input id="0" type="radio" name="mapeo" value="asociativo" checked onclick="swap(1,0)">
                                <span>
                                    Mapeo Asociativo
                                </span>
                            </div>
                        </label>
                        
                        <label>
                            <div>
                                <input id="1" type="radio" name="mapeo" value="directo" onclick="swap(0,1)">
                                <span>
                                    Mapeo Directo
                                </span>
                            </div>
                        </label>
                    </div>
                    <h3>Distribución de la bits</h3>
                        <div id="campos-texto" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;">
                            <input id="bit-tag" type="text" class="campo-texto" placeholder="Bits para tag">
                            <input id="bit-linea" type="text" class="campo-texto" placeholder="Bits para linea" style="display: none">
                            <input id="bit-palabra" type="text" class="campo-texto" placeholder="Bits para palabra">

                        </div>
                    <h3>Direcciones de memoria a acceder</h3>
                    <div>
                        <textarea id="dir_mem" type="text" class="campo-texto" name="direcciones-memoria"
                            rows="5" 
                            cols="40" 
                            placeholder="direcciones de memoria separadas por comas, ejemplo: 0x000A, 0x000B, 0x000C"
                            style="width: 100%; height: 100px; resize: none;"></textarea>
                    </div>
                    <div class="zona-calcular">
                        <button
                            id="button"
                            class="boton-calcular"
                            onclick="generarTabla()">
                            Generar tabla
                        </button>
                    </div>

                    <div id="t_res" class="resultado" style="display: none;">
                        <table id="tabla" class="tabla">
                            <thead id="cabecera">
                                <tr>
                                    
                                </tr>
                            </thead>
                            <tbody id="tabla-body">
                                <!-- Las filas de la tabla se generarán dinámicamente aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../scripts/sidemenu.js"></script>
    <script src="../scripts/mode.js"></script>
    <script src="../scripts/cache_t.js"></script>
</body>
</html>
